<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Luanda Rodrigues — Data Analyst focused on Health, Operations and Decision Intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F5EF"/>
      <stop offset="0.55" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#E7F2EE"/>
    </linearGradient>
    <linearGradient id="charcoal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111416"/>
      <stop offset="1" stop-color="#0F3F3B"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#111416" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#111416" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="34" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="34" fill="url(#grid)"/>
  <circle cx="1130" cy="78" r="122" fill="#1C7C73" opacity="0.08"/>
  <circle cx="95" cy="310" r="190" fill="#79D1C3" opacity="0.10"/>

  <rect x="74" y="70" width="138" height="138" rx="34" fill="#FFFDF8" stroke="#111416" stroke-opacity="0.10" filter="url(#shadow)"/>
  <text x="108" y="157" font-family="Manrope, Inter, Arial, sans-serif" font-size="54" font-weight="900" fill="#111416" letter-spacing="-5">LR</text>
  <circle cx="158" cy="168" r="10" fill="#1C7C73"/>
  <path d="M 154 164 L 185 145" stroke="#1C7C73" stroke-width="5" stroke-linecap="round" opacity="0.72"/>

  <text x="250" y="122" font-family="Manrope, Inter, Arial, sans-serif" font-size="58" font-weight="900" fill="#111416" letter-spacing="-3">Luanda Rodrigues</text>
  <text x="252" y="170" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="650" fill="#26302F">Data Analyst focused on Health, Operations &amp; Decision Intelligence</text>
  <text x="252" y="218" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#1C7C73" letter-spacing="1.8">HEALTH ANALYTICS · BI · MACHINE LEARNING · SQL · GRAPH ANALYTICS</text>

  <rect x="252" y="250" width="158" height="38" rx="19" fill="url(#charcoal)"/>
  <text x="277" y="276" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="850" fill="#FFFDF8">PORTFOLIO</text>
  <rect x="426" y="250" width="118" height="38" rx="19" fill="#FFFFFF" stroke="#111416" stroke-opacity="0.14"/>
  <text x="451" y="276" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="850" fill="#111416">REMOTE</text>
  <rect x="560" y="250" width="174" height="38" rx="19" fill="#FFFFFF" stroke="#111416" stroke-opacity="0.14"/>
  <text x="585" y="276" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="850" fill="#111416">RELOCATION</text>
